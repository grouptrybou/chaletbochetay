<!DOCTYPE html>
<html lang="fr" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Bochetay</title>
  <link rel="icon" type="image/svg+xml" href="logo-chalet-bochetay.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Poppins', sans-serif; background: linear-gradient(rgb(69,88,68) 0%, rgb(0,36,3) 100%); height: 100vh; overflow: hidden; color: #fff; display: flex; flex-direction: column; }
    .lang-content { display: none; }
    body.lang-nl .nl { display: block; }
    body.lang-fr .fr { display: block; }
    body.lang-nl .nl-inline { display: inline; }
    body.lang-fr .fr-inline { display: inline; }
    .nl-inline, .fr-inline { display: none; }
    header { flex-shrink: 0; z-index: 1000; background: rgba(38,60,38,.97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.09); box-shadow: 0 2px 20px rgba(0,0,0,.32); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; height: 72px; }
    .logo img { height: 54px; width: auto; }
    nav.main-nav { display: flex; align-items: center; gap: 32px; }
    nav.main-nav a { color: #fff; text-decoration: none; font-size: 15px; font-weight: 500; transition: opacity .2s; }
    nav.main-nav a:hover { opacity: .75; }
    .lang-toggle { display: flex; gap: 6px; }
    .lang-btn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 5px 13px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; }
    .lang-btn.active, .lang-btn:hover { background: rgba(255,255,255,.3); }
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-head { flex-shrink: 0; padding: 16px 8%; text-align: center; }
    .page-head h1 { font-size: clamp(18px, 2vw, 26px); font-weight: 700; color: #fff; }
    .menu-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .menu-frame { flex: 1; display: flex; justify-content: center; align-items: stretch; overflow: hidden; }
    .menu-frame iframe { height: 100%; width: auto; aspect-ratio: 1 / 1.414; border: none; display: block; }
    .btn-wrap { flex-shrink: 0; text-align: center; padding: 18px 0 20px; }
    .btn-home { display: inline-flex; align-items: center; justify-content: center; padding: 10px 26px; border-radius: 999px; background: rgb(156,100,0); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; transition: background .2s; }
    .btn-home:hover { background: rgb(128,82,0); }
    .nav-toggle { display: none; background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; padding: 4px 8px; line-height: 1; }
    .mobile-reserve { display: none; }
    @media (max-width: 768px) {
      header { padding: 0 20px; height: 60px; }
      .logo img { height: 42px; }
      .nav-toggle { display: block; }
      nav.main-nav {
        display: none; flex-direction: column; gap: 18px;
        position: fixed; top: 60px; left: 0; right: 0;
        background: rgb(40,62,40); padding: 22px 24px 28px;
        z-index: 998; border-top: 1px solid rgba(255,255,255,.1);
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
      }
      nav.main-nav.open { display: flex; }
      nav.main-nav a { font-size: 17px; }
      .lang-toggle { margin-top: 4px; }
      .page-head { padding: 8px 16px; }
      body { padding-bottom: 64px; overflow: hidden; }
      .mobile-reserve {
        display: flex; align-items: center; justify-content: center;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
        background: rgb(156,100,0); padding: 14px 20px;
        box-shadow: 0 -2px 12px rgba(0,0,0,.3);
      }
      .mobile-reserve a { color: #fff; text-decoration: none; font-weight: 700; font-size: 16px; font-family: 'Poppins', sans-serif; }
    }
      .credit-bar { background: rgb(20,35,20); padding: 10px 8%; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: rgba(255,255,255,.4); }
    .credit-bar a { color: rgba(255,255,255,.5); text-decoration: none; transition: color .2s; }
    .credit-bar a:hover { color: #fff; }
    .food-btn { background: none; border: none; cursor: pointer; font-size: 22px; line-height: 1; padding: 0 4px; transition: transform .15s; }
    .food-btn:hover { transform: scale(1.3); }
    .food-btn.pop { animation: foodpop .35s ease; }
    @keyframes foodpop { 0%{transform:scale(1)} 50%{transform:scale(1.7) rotate(15deg)} 100%{transform:scale(1)} }
  
    nav.main-nav a.nav-active { border-bottom: 2px solid rgba(255,255,255,.65); padding-bottom: 3px; opacity: 1; }
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .65s ease, transform .65s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
  
    nav.main-nav a { position: relative; }
    nav.main-nav a::after { content: ''; position: absolute; bottom: -5px; left: 0; right: 0; height: 1.5px; background: rgba(255,255,255,.7); transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
    nav.main-nav a:hover::after, nav.main-nav a.nav-active::after { transform: scaleX(1); }
    nav.main-nav a.nav-active { border-bottom: none !important; padding-bottom: 0 !important; opacity: 1; }
    .lang-btn.active { background: rgba(255,255,255,.88) !important; color: rgb(35,58,35) !important; border-color: transparent !important; }
    .btn-reserve { box-shadow: 0 2px 14px rgba(156,100,0,.35); transition: background .2s, box-shadow .2s, transform .15s !important; letter-spacing: .02em; }
    .btn-reserve:hover { transform: translateY(-1px); box-shadow: 0 5px 22px rgba(156,100,0,.55) !important; }
    .nav-reserve { display: inline-flex; align-items: center; padding: 7px 18px; border-radius: 999px; background: rgb(156,100,0); color: #fff !important; text-decoration: none; font-weight: 600; font-size: 13px; transition: background .2s, transform .15s; white-space: nowrap; box-shadow: 0 2px 10px rgba(156,100,0,.35); }
    .nav-reserve:hover { background: rgb(128,82,0) !important; transform: translateY(-1px); opacity: 1 !important; box-shadow: 0 4px 18px rgba(156,100,0,.55) !important; }
    .nav-reserve::after { display: none !important; }
    @media (max-width: 768px) { .nav-reserve { display: none !important; } }

    #menu-loader {
      position: absolute; inset: 0; z-index: 10;
      background: linear-gradient(rgb(69,88,68) 0%, rgb(0,36,3) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; transition: opacity .6s ease;
    }
    #menu-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-emoji { font-size: 48px; animation: spin 1.4s linear infinite; display: block; }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .loader-text { font-size: 14px; color: rgba(255,255,255,.6); letter-spacing: .08em; }
    .loader-dots::after { content: ''; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
    .menu-frame { position: relative; }
  </style>
</head>
<body class="lang-fr" id="page-body">
<header>
  <a href="index.html" class="logo">
    <img src="logo-chalet-bochetay.svg" alt="Chalet Bochetay logo">
  </a>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu">&#9776;</button>
  <nav class="main-nav" id="main-nav">
    <a href="index.html"><span class="nl-inline">Home</span><span class="fr-inline">Accueil</span></a>
    <a href="menu.html">Menu</a>
    <a href="offres.html"><span class="nl-inline">Speciale aanbiedingen</span><span class="fr-inline">Offres Spéciales</span></a>
    <a href="evenements.html"><span class="nl-inline">Evenementen</span><span class="fr-inline">Événements</span></a>
    <a href="https://bookings.zenchef.com/results?rid=381630" class="nav-reserve" target="_blank"><span class="nl-inline">Reserveer</span><span class="fr-inline">R&eacute;server</span></a>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">FR</button>
      <button class="lang-btn" id="btn-nl" onclick="setLang('nl')">NL</button>
    </div>
  </nav>
</header>
<div class="mobile-reserve">
  <a href="https://bookings.zenchef.com/results?rid=381630" target="_blank">
    &#127860;&nbsp;<span class="nl-inline">Reserveer een tafel</span><span class="fr-inline">R&eacute;server une table</span>
  </a>
</div>
<main>
  <section class="page-head">
    <h1 class="nl lang-content">Wat mag het zijn? Onze kaart voor u.</h1>
    <h1 class="fr lang-content">Que vous inspire-t-on aujourd'hui ? Voici notre carte.</h1>
  </section>
  <section class="menu-panel">
    <div class="menu-frame">
      <div id="menu-loader">
        <span class="loader-emoji">🍽️</span>
        <span class="loader-text nl-inline">Kaart laden<span class="loader-dots"></span></span>
        <span class="loader-text fr-inline">Chargement de la carte<span class="loader-dots"></span></span>
      </div>
      <iframe id="menu-iframe"
        src="https://www.canva.com/design/DAG9fOXBxVQ/J8--QSu_ONLVKLMOI1i3Mg/view?embed"
        allowfullscreen="allowfullscreen" allow="fullscreen">
      </iframe>
    </div>
  </section>
</main>
<script>
  function setLang(lang) {
    localStorage.setItem('lang', lang);
    const body = document.getElementById('page-body');
    body.className = 'lang-' + lang;
    document.getElementById('html-root').lang = lang;
    document.getElementById('btn-nl').classList.toggle('active', lang === 'nl');
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
  }
  setLang(localStorage.getItem('lang') || 'fr');
  document.getElementById('menu-iframe').addEventListener('load', function() {
    var loader = document.getElementById('menu-loader');
    loader.classList.add('hidden');
    setTimeout(function(){ loader.style.display = 'none'; }, 650);
  });
  document.getElementById('nav-toggle').addEventListener('click', function() {
    const nav = document.getElementById('main-nav');
    const open = nav.classList.toggle('open');
    this.textContent = open ? '✕' : '☰';
  });
  document.getElementById('main-nav').querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      document.getElementById('main-nav').classList.remove('open');
      document.getElementById('nav-toggle').textContent = '☰';
    });
  });
</script>

<div class="credit-bar">
  <span>website by <a href="https://thibotreve.be" target="_blank">thibotreve.be</a></span>
  <button class="food-btn" id="food-btn" title="Klik!">&#127869;&#65039;</button>
</div>
<script>
(function(){
  var f=['🍽️','🥩','🍟','🍤','🥗','🍷','🍺','🥘','🍲','🧀','🥖','🥧','🍰'];
  var btn=document.getElementById('food-btn');
  if(btn) btn.addEventListener('click',function(){this.textContent=f[Math.floor(Math.random()*f.length)];this.classList.remove('pop');void this.offsetWidth;this.classList.add('pop');});
})();
</script>

<script>
(function(){
  var foods=['🍽️','🥩','🍟','🍤','🥗','🍷','🍺','🥘','🍲','🧀','🥖','🥧','🍰','🫕','🍜','🥐'];
  var footer=document.querySelector('.credit-bar');
  if(!footer) return;
  var last=0;
  footer.addEventListener('mousemove',function(e){
    var now=Date.now();
    if(now-last<110) return;
    last=now;
    var s=document.createElement('span');
    s.textContent=foods[Math.floor(Math.random()*foods.length)];
    s.style.cssText='position:fixed;left:'+e.clientX+'px;top:'+e.clientY+'px;font-size:22px;pointer-events:none;z-index:9999;opacity:1;transition:transform 1s ease,opacity 1s ease;transform:translateY(0) rotate(0deg);';
    document.body.appendChild(s);
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      s.style.transform='translateY(-55px) rotate('+(Math.random()*50-25)+'deg)';
      s.style.opacity='0';
    });});
    setTimeout(function(){s.remove();},1150);
  });
})();
</script>
<script>
(function(){
  var path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('nav.main-nav a[href]').forEach(function(a){
    var h = a.getAttribute('href');
    if(h === path || (h === '#' && (path === 'index.html' || path === ''))) a.classList.add('nav-active');
  });
  var sels = ['.chef','.cuisine','.map-wrap','.offers-grid','.events-grid'];
  var els = document.querySelectorAll(sels.join(','));
  if(!els.length || !window.IntersectionObserver) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
  },{threshold:0.08});
  els.forEach(function(el){ el.classList.add('reveal'); io.observe(el); });
})();
</script></body>
</html>
